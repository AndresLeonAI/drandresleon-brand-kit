<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada — Dr. Andrés León</title>
<link rel="stylesheet" href="base.css">
<!-- PORTADA de carrusel · 1080×1350. Primera slide. Gancho de máximo 8 palabras en dos tonos. Educativo, sin promesas. -->
</head>
<body class="tinta">
<div class="lienzo">
  <div class="cabeza">
    <img class="logo" src="../../marca/logo-claro.png" alt="Dr. Andrés León">
    <span class="contador" data-editar="contador">01 / 06</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:44px">
    <p class="rotulo" data-editar="rotulo">Endodoncia · explicado simple</p>
    <h1 class="grande" style="font-size:116px" data-editar="titular">
      A veces el problema no se ve: <span class="remate">está dentro del diente.</span>
    </h1>
  </div>

  <div class="pie" style="margin-top:88px">
    <p class="mini" data-editar="bajada" style="max-width:26ch">Lo que conviene saber antes de que duela más.</p>
    <span class="flecha">&#8600;</span>
  </div>
</div>
</body>
</html>
