<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cierre CTA — Dr. Andrés León</title>
<link rel="stylesheet" href="base.css">
<!-- CIERRE CTA · 1080×1350. SIEMPRE la última slide. Una sola acción: agendar la cita. Si el doctor ya entregó WhatsApp o enlace, ver contenido/cta.md para reemplazar la línea de contacto. -->
</head>
<body class="tinta">
<div class="lienzo">
  <div class="cabeza">
    <img class="logo" src="../../marca/logo-claro.png" alt="Dr. Andrés León">
    <span class="contador" data-editar="contador">06 / 06</span>
  </div>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:40px">
    <p class="rotulo">El siguiente paso</p>
    <h2 class="mega" style="font-size:150px" data-editar="titular">Agenda<br><span class="remate">tu cita.</span></h2>
    <p class="cuerpo" style="color:var(--gris-claro)" data-editar="cuerpo">Antiguo Country, Bogotá. Una valoración dice qué necesita tu diente.</p>
  </div>

  <div class="regla" style="margin-top:64px"></div>
  <div class="pie" style="margin-top:40px;align-items:center">
    <span class="pill llena">Agendar mi cita &#8594;</span>
    <span class="mini" style="text-align:right" data-editar="contacto">Escríbenos por<br>mensaje directo</span>
  </div>
</div>
</body>
</html>
